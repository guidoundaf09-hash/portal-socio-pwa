<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Caja de Ahorros Unión y Progreso</title>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#003087">
</head>

<body style="
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#003087;
  font-family:Arial,sans-serif;
">

  <div style="
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    max-width:400px;
  ">

    <h1 style="color:#003087;">
      Caja de Ahorros
    </h1>

    <h2 style="color:#003087;">
      Unión y Progreso
    </h2>

    <p>
      🏦 Prueba de PWA
    </p>

    <button onclick="probarConexion()" style="
  background:#003087;
  color:white;
  border:none;
  padding:14px 25px;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
">
  🔗 PROBAR CONEXIÓN
</button>

<p id="estado" style="margin-top:20px;">
  Pulsa el botón para comprobar la conexión.
</p>

  </div>

<script>

const URL_APPS_SCRIPT =
  'https://script.google.com/macros/s/AKfycbwapUQnX_Y9YZuF1Z4I_gilpgk9mIMiwSoUHofSkYPl_g-hbuAdoGxVP2N0Uu0F_D_USw/exec?page=pruebaPWA';


async function probarConexion() {

  const estado = document.getElementById('estado');

  estado.textContent = '⏳ Conectando con el servidor...';

  try {

    const respuesta = await fetch(URL_APPS_SCRIPT);

    if (!respuesta.ok) {
      throw new Error('Error HTTP ' + respuesta.status);
    }

    const datos = await respuesta.json();

    if (datos.ok === true) {

      estado.textContent =
        '✅ Servidor conectado correctamente';

    } else {

      estado.textContent =
        '⚠️ El servidor respondió, pero hubo un problema';

    }

  } catch (error) {

    console.error(error);

    estado.textContent =
      '❌ No se pudo conectar con Apps Script';

  }

}

</script>
</body>
</html>
